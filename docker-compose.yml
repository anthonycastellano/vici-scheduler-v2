services:
  api:
    build:
      dockerfile: Dockerfile
      context: ./backend
    environment:
      - NODE_ENV=production
      - COSMOS_CONNECTION_STRING=${COSMOS_CONNECTION_STRING}
      - TOKEN_KEY=${TOKEN_KEY}
      - ADMIN_USERNAME=${ADMIN_USERNAME}
      - ADMIN_PASSWORD_HASH=${ADMIN_PASSWORD_HASH}
    depends_on:
      - mongo
  client:
    build:
      dockerfile: Dockerfile
      context: ./frontend
    volumes:
      - /app/node_modules
      - ./frontend:/app
  proxy:
    restart: always
    build:
      dockerfile: Dockerfile
      context: ./nginx
    ports:
      - '80:80'
    depends_on:
      - api
      - client
  mongo:
    image: mongo:8.0
    restart: always
    environment:
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_INITDB_ROOT_USERNAME}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_INITDB_ROOT_PASSWORD}
    ports:
      # Published deliberately: Tony accesses this DB directly from MongoDB
      # Compass and has accepted the exposure (no sensitive data; access
      # controlled via DigitalOcean cloud firewall IP allow rules).
      # Do not "harden" this back to loopback without asking.
      - '27017:27017'
