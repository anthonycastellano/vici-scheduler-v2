services:
  api:
    build:
      dockerfile: Dockerfile
      context: ./backend
    environment:
      - NODE_ENV=production
      - COSMOS_CONNECTION_STRING=${COSMOS_CONNECTION_STRING}
      - TOKEN_KEY=${TOKEN_KEY}
      - ADMIN_USERNAME=${ADMIN_USERNAME}
      - ADMIN_PASSWORD_HASH=${ADMIN_PASSWORD_HASH}
    depends_on:
      - mongo
  client:
    build:
      dockerfile: Dockerfile
      context: ./frontend
    volumes:
      - /app/node_modules
      - ./frontend:/app
  proxy:
    restart: always
    build:
      dockerfile: Dockerfile
      context: ./nginx
    ports:
      - '80:80'
    depends_on:
      - api
      - client
  mongo:
    image: mongo:8.0
    restart: always
    environment:
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_INITDB_ROOT_USERNAME}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_INITDB_ROOT_PASSWORD}
    # not published to the host on purpose: the api container reaches it
    # over the internal compose network. Publish 27017 only for debugging.
