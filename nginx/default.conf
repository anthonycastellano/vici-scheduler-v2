upstream client {
    server client:80;
}

upstream api {
    server api:3001;
}

server {
    listen 80;

    # basic security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    location / {
        proxy_pass http://client;
    }

    location /ws {
        proxy_pass http://client;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
    }

    location /api {
        rewrite /api/(.*) /$1 break;
        # the api's login rate limiter keys on client IP. Behind Cloudflare the
        # real client IP arrives in CF-Connecting-IP; forward it as X-Forwarded-For
        # so Express (trust proxy) buckets per user instead of per proxy.
        # NOTE: only safe while the origin is firewalled to Cloudflare's IP ranges,
        # otherwise CF-Connecting-IP can be spoofed by direct origin access.
        proxy_set_header X-Forwarded-For $http_cf_connecting_ip;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header Host $host;
        proxy_pass http://api;
    }
}
